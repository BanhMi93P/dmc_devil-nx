# DmC - Devil May Cry (Title ID 43430824, XDK 2.0.21119.16384, D3D9LTCG) - ReXGlue codegen configuration.
# Internal project target keeps "renut" so CMake, post_codegen.py, and Renut renderer glue work seamlessly;
# final Switch NRO/folder are dmc_devil/dmc_devil.nro.

includes = [
  "config/renut_funcs.toml",
  "config/renut_hooks.toml",
  "config/renut_gpu_funcs.toml",
  "overrides.toml",
]

# Safe generic ReXGlue codegen optimisations (no game-specific address assumptions):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# Register-diet options kept OFF on initial clean pass until DmC audit (read_before_write / non_argument_audit):
non_volatile_as_local = false
elide_lr_stores = false
non_argument_as_local = false
